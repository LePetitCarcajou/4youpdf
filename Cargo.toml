[workspace]
resolver = "2"
members = [
    "crates/fyp-core",
    "crates/fyp-crypto",
    "crates/fyp-conformance",
    "crates/fyp-plugin-api",
    "crates/fyp-host",
    "crates/fyp-cli",
    "plugins/merge",
    "app",
]
exclude = ["fuzz", "tools/bench_host"]

[workspace.package]
# The version of the product, which a release tag names: fyp-core,
# fyp-crypto, fyp-conformance, fyp-cli and fyp-app take it. fyp-plugin-api
# and fyp-host keep their own (CLAUDE.md, ADR 0003). Both rules are checked
# by tools/check_version.py.
version = "0.3.3"
edition = "2021"
# The minimum Rust of the product, that of its most demanding dependency:
# Wasmtime 48 (LTS), through fyp-host and fyp-cli. fyp-plugin-api, which
# authors of modules compile, keeps its own, as low as it builds (CLAUDE.md).
rust-version = "1.95"
license = "AGPL-3.0-or-later"
repository = "https://github.com/LePetitCarcajou/4youpdf"
authors = ["4YouPDF contributors"]

[workspace.dependencies]
fyp-core = { path = "crates/fyp-core", version = "0.3.3" }
fyp-crypto = { path = "crates/fyp-crypto", version = "0.3.3" }
fyp-conformance = { path = "crates/fyp-conformance", version = "0.3.3" }
fyp-plugin-api = { path = "crates/fyp-plugin-api", version = "0.2.0" }
fyp-host = { path = "crates/fyp-host", version = "0.2.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
semver = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
