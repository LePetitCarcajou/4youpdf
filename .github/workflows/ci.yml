name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# dtolnay/rust-toolchain is pinned by commit: it has no release tag, and a
# branch would run whatever it points to that day. The toolchain itself comes
# from the `toolchain` input.
jobs:
  check:
    name: fmt · clippy · deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # fyp-app links against WebKitGTK through Tauri 2.
      - name: install Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            pkg-config
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2

  test:
    name: test (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      # fyp-app links against WebKitGTK through Tauri 2.
      - name: install Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            pkg-config
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  wasm:
    name: modules in the WebAssembly sandbox
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: stable
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      # Builds each crate of plugins/ for wasm32-wasip1 and copies it to
      # plugins/<name>/module.wasm, where fyp-host loads it.
      - run: python3 tools/build_modules.py
      # The sandbox and `fyp run` against the real modules: here a missing
      # module.wasm fails the tests instead of skipping them.
      - run: cargo test -p fyp-host -p fyp-cli -p fyp-plugin-merge
        env:
          FYP_REQUIRE_MODULES: "1"

  # The minimum Rust of the product (CLAUDE.md), which no job tried before:
  # the 1.80 once declared was false for a long time. The whole workspace is
  # built and tested with exactly that toolchain, and the module of the
  # repository is checked for wasm32-wasip1. One runner is enough: a
  # rust-version is about the compiler, not the platform.
  msrv-product:
    name: product on its MSRV
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      # fyp-app links against WebKitGTK through Tauri 2.
      - name: install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            pkg-config
      # Also fails if a crate other than the contract overrides it.
      - name: read the rust-version of the workspace
        id: msrv
        run: |
          version=$(python3 tools/check_version.py --rust-version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          targets: wasm32-wasip1
      # For every later step, over rust-toolchain.toml, which would select
      # stable: the cache is keyed on this toolchain too.
      - run: echo "RUSTUP_TOOLCHAIN=$MSRV" >> "$GITHUB_ENV"
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo check -p fyp-plugin-merge --locked --target wasm32-wasip1

  # The contract of the modules keeps the lowest Rust it builds with, below
  # that of the product (CLAUDE.md): authors of modules compile it. Checked
  # with exactly the rust-version of its Cargo.toml, for the host and for
  # wasm32-wasip1, so that neither its code nor a dependency raises it
  # unnoticed.
  msrv-plugin-api:
    name: fyp-plugin-api on its MSRV
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Also fails if the contract does not give its own.
      - name: read the rust-version of fyp-plugin-api
        id: msrv
        run: |
          version=$(python3 tools/check_version.py --rust-version fyp-plugin-api)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          targets: wasm32-wasip1
      # For every later step, over rust-toolchain.toml, which would select
      # stable.
      - run: echo "RUSTUP_TOOLCHAIN=$MSRV" >> "$GITHUB_ENV"
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
      - run: cargo test -p fyp-plugin-api --locked
      - run: cargo check -p fyp-plugin-api --locked --target wasm32-wasip1

  # The rendering fidelity guard (docs/banc-rendu.md, « Garde en CI »):
  # written, not active. The bench draws the reference page set with two
  # engines and exits with code 3 when a page of B is further from A than
  # the threshold, when B fails where A draws, or when a page cannot be
  # measured. B can be PDFium itself, against which the only threshold known
  # is zero, or hayro, against which none is set (docs/mesure-hayro.md).
  # Missing before `if: false` goes: the
  # engine to guard; a threshold measured against it on this runner, whose
  # system fonts are not those of the machine that chose the set; the public
  # corpus, fetched from three repositories, cached; a run that fits a job.
  render-fidelity:
    name: rendering fidelity guard (inactive)
    if: false
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: python3 tools/fetch_pdfium.py
      - run: python3 tools/fetch_corpus.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # --b: the engine to guard, once it exists; --fail-above: its measured
      # threshold.
      - run: cargo run --release -p fyp-render-bench -- run --a pdfium --b pdfium --fail-above 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-fidelity-report
          path: target/render-bench/

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: every commit must carry Signed-off-by
        run: |
          set -e
          for sha in $(git rev-list origin/${{ github.base_ref }}..HEAD); do
            if ! git log -1 --format=%B "$sha" | grep -q '^Signed-off-by: '; then
              echo "commit $sha is not signed off (use git commit -s)"; exit 1
            fi
          done
