name: Nightly fuzz

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# Every target of fuzz/ (fuzz/README.md), each for a fixed time, all of
# them even when one fails: a crash or a timeout fails the job and keeps
# the input as an artifact. The targets that read a PDF start from
# tests/fixtures and from the public corpus, fetched as tools/fetch_corpus.py
# fetches it locally; what a night finds is not kept for the next
# (docs/backlog-technique.md). Every action is pinned by commit, the comment
# naming the release that commit is, and so is cargo-fuzz.
jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: nightly
      - run: cargo +nightly install cargo-fuzz --version =0.13.2 --locked
      - run: python3 tools/fetch_corpus.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # libFuzzer writes what it finds into the first directory and only
      # reads the others, truncated to -max_len.
      - run: mkdir -p fuzz/corpus/document fuzz/corpus/filters fuzz/corpus/plugin_api
      - run: cargo +nightly fuzz run document fuzz/corpus/document tests/fixtures tests/corpus -- -max_total_time=1800 -max_len=65536 -timeout=60 -rss_limit_mb=4096
      - run: cargo +nightly fuzz run filters fuzz/corpus/filters tests/fixtures -- -max_total_time=600 -max_len=65536 -timeout=60 -rss_limit_mb=4096
        if: ${{ !cancelled() }}
      - run: cargo +nightly fuzz run parse_object -- -max_total_time=1800
        if: ${{ !cancelled() }}
      - run: cargo +nightly fuzz run quick_info -- -max_total_time=600
        if: ${{ !cancelled() }}
      - run: cargo +nightly fuzz run plugin_api fuzz/corpus/plugin_api plugins/merge -- -max_total_time=300 -max_len=65536 -timeout=60
        if: ${{ !cancelled() }}
      - run: cargo +nightly fuzz run host_wasi -- -max_total_time=600
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
