[package]
name = "fyp-host"
description = "Loads 4YouPDF modules, enforces permissions and resource limits"
# Not the version of the workspace: the host is versioned with the contract
# of the modules (CLAUDE.md, ADR 0003).
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
fyp-core = { workspace = true }
fyp-plugin-api = { workspace = true }
thiserror = { workspace = true }
# The sandbox (ADR 0003). No `wat`: the host only loads binary modules.
# No `wasi` crate either: the few WASI functions a module receives are
# implemented in `sandbox.rs`, none of them touches the system.
wasmtime = { version = "48.0.2", default-features = false, features = [
    "runtime",
    "cranelift",
    "std",
    "parallel-compilation",
] }
# Only for the `fuzzing` feature: the fuzz harness writes its trampoline
# module in the text format.
wat = { version = "1", optional = true }

[features]
# `fyp_host::fuzzing`: the harness behind `fuzz/fuzz_targets/host_wasi.rs`.
# Never enabled by the application.
fuzzing = ["dep:wat"]

[dev-dependencies]
# Hostile test modules are written in the text format.
wat = "1"

[lints]
workspace = true
