[package]
name = "fyp-plugin-merge"
description = "4YouPDF module: merge several documents into one"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# A WASI command for wasm32-wasip1: `tools/build_modules.py` builds the
# binary and copies it to `module.wasm`, next to `manifest.toml`.
[lib]
path = "src/lib.rs"

[[bin]]
name = "fyp-plugin-merge"
path = "src/main.rs"

[dependencies]
fyp-plugin-api = { workspace = true }
# Compiled into the module, inside the sandbox: the same merge as the core.
fyp-core = { workspace = true }

[lints]
workspace = true
